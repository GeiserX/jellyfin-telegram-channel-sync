services:
  jellytelegram-sync:
    image: drumsergio/jellyfin-telegram-channel-sync:1.3.0
    container_name: jellytelegram-sync
    environment:
      # Telegram user account (lists the channel members)
      - TELEGRAM_API_ID=your_telegram_api_id
      - TELEGRAM_API_HASH=your_telegram_api_hash
      - TELEGRAM_CHANNEL=-1001234567890

      # Telegram bot (owner commands and notifications)
      - TELEGRAM_BOT_TOKEN=your_bot_token
      - OWNER_ID=your_numeric_telegram_id

      # Jellyfin
      - JELLYFIN_URL=http://your_jellyfin_url:8096
      - JELLYFIN_API_KEY=your_jellyfin_api_key

      # Safety: skip the cycle if fewer members than this come back
      - THRESHOLD_ENTRIES=100
      # Seconds between cycles
      - SCRIPT_INTERVAL=3600
      # Hours a member may be missing before the account is disabled
      - GRACE_HOURS=72
      # Days without using Jellyfin before an account is disabled. 0 switches
      # this rule off
      - INACTIVE_DAYS=365
      # Jellyfin usernames neither rule may ever touch, comma separated
      - EXEMPT_USERS=
      # Start with true; flip to false (or /dryrun off) once the links look right
      - DRY_RUN=true

    volumes:
      - ./data:/app/data # database and both Telegram session files

    restart: unless-stopped
